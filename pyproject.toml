[project]
name = "bakasur"
version = "0.1.0"
description = "Goa Official Gazette Section 39A table extractor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling[ocrmac,vlm]>=2.127.0",
    "docling-core[chunking]>=2.96.0",
    "pypdfium2>=4.0.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bakasur = "bakasur.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakasur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: integration tests that invoke Docling on fixture PDFs",
]
